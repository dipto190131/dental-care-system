services:
  - type: web
    name: dental-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:express
    envVars:
      - key: NODE_ENV
        value: production
      - key: DJANGO_HOST
        fromService:
          name: dental-backend
          type: web
          property: host
      - key: DJANGO_PORT
        value: "443"

databases:
  - name: postgres
    plan: free
    version: "15"
    initializer:
      plan: free

  - type: web
    name: dental-backend
    env: python
    region: oregon
    plan: free
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dental_care.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60
    rootDir: backend
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
